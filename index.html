<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maria Carter</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .card {
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    padding: 48px 40px;
    max-width: 380px;
    text-align: center;
  }
  .card h1 {
    margin: 0 0 4px;
    color: #092244;
    font-size: 28px;
  }
  .card h2 {
    margin: 0 0 20px;
    color: #287BE8;
    font-size: 16px;
    font-weight: 500;
  }
  .card p {
    color: #444444;
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  .contact {
    display: inline-block;
    padding: 10px 24px;
    background: #092244;
    color: #ffffff;
    border-radius: 8px;
    font-size: 14px;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Maria Carter</h1>
    <h2>Team Lead II</h2>
    <p>I lead and support my team, helping us work smarter and hit our goals together.</p>
    <div class="contact">Let's connect</div>
  </div>
</body>
</html>
